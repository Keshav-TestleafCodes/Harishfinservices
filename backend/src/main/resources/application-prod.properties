# ============================================================
# PRODUCTION — Render + Supabase
# All sensitive values come from Render environment variables.
# Set these in your Render service dashboard.
# ============================================================

server.port=${PORT:8080}

# PostgreSQL via Supabase
# Set DATABASE_URL in Render as:
# postgresql://[user]:[password]@[host]:5432/[dbname]?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# File Storage
# Render ephemeral disk — files persist during a deploy cycle.
# For permanent storage, integrate Cloudinary (see README).
app.upload.dir=/tmp/finfolio-uploads

# JWT — set APP_JWT_SECRET in Render (min 32 random chars)
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=86400000

# CORS — set to your Vercel frontend URL
# e.g. https://finfolio.vercel.app
app.cors.allowed-origins=${FRONTEND_URL}

# Multipart
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
